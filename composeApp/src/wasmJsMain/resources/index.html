<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Jose Garcia - Mobile Developer Expert</title>
    <script type="application/javascript">
        function openLink(url) {
            window.open(url, "_blank");
        }
    </script>
    <style>
        /* Make the page and canvas fill the viewport on all devices */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* prevent page scrolling/gutters */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        /* Ensure the canvas used by Compose fills the whole screen */
        #ComposeTarget {
            position: fixed;
            inset: 0;
            display: block;
            background: transparent;
            width: 100%;
            height: 100%;
        }
        body { background: #3a2b2b; }
    </style>
    <script>
        (function () {
            const canvas = () => document.getElementById('ComposeTarget');
            let last = { w: 0, h: 0 };

            function resizeCanvas() {
                const el = canvas();
                if (!el) return;

                const cssWidth = window.innerWidth;
                const cssHeight = window.innerHeight;

                // Set canvas pixel dimensions to CSS logical pixels.
                // Skiko (CanvasBasedWindow) handles DPR scaling internally,
                // so multiplying here would cause double-scaling and shrink content.
                el.width = Math.floor(cssWidth);
                el.height = Math.floor(cssHeight);
                el.style.width = cssWidth + 'px';
                el.style.height = cssHeight + 'px';

                last.w = cssWidth;
                last.h = cssHeight;
            }

            window.addEventListener('resize', resizeCanvas);
            window.addEventListener('orientationchange', resizeCanvas);
            window.addEventListener('pageshow', resizeCanvas);
            window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resizeCanvas(); });
            window.addEventListener('focus', resizeCanvas);

            setInterval(() => {
                const cssW = window.innerWidth;
                const cssH = window.innerHeight;
                if (cssW !== last.w || cssH !== last.h) resizeCanvas();
            }, 250);

            resizeCanvas();
        })();
    </script>
    <script type="application/javascript" src="skiko.js"></script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<canvas id="ComposeTarget"></canvas>
</body>
</html>
