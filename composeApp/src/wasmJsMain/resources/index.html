<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jose Garcia - Mobile Developer Expert</title>
    <script type="application/javascript">
        function openLink(url) {
            window.open(url, "_blank");
        }
    </script>
    <style>
        /* Make the page and canvas fill the viewport on all devices */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* prevent page scrolling/gutters */
        }
        /* Ensure the canvas used by Compose fills the whole screen */
        #ComposeTarget {
            position: fixed;
            inset: 0; /* top:0; right:0; bottom:0; left:0 */
            display: block; /* remove default inline spacing */
            background: transparent;
            outline: 2px solid magenta; /* debug outline to see actual canvas area */
        }
        body { background: #3a2b2b; }
    </style>
    <script>
        // Resize the canvas to match the viewport (no DPR multiplication)
        function resizeCanvas() {
            const canvas = document.getElementById('ComposeTarget');
            if (!canvas) return;
            const cssWidth = window.innerWidth;
            const cssHeight = window.innerHeight;
            // Use logical CSS pixels for the canvas backing store (no DPR multiplication)
            canvas.width = Math.floor(cssWidth);
            canvas.height = Math.floor(cssHeight);
            canvas.style.width = cssWidth + 'px';
            canvas.style.height = cssHeight + 'px';
            console.log('[resizeCanvas] css:', cssWidth, cssHeight, 'attr:', canvas.width, canvas.height, 'rect:', canvas.getBoundingClientRect());
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        // call once synchronously so canvas has correct size before Compose starts
        resizeCanvas();
    </script>
    <script type="application/javascript" src="skiko.js"></script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
<canvas id="ComposeTarget"></canvas>
</body>
</html>
